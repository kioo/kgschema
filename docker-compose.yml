version: '3.8'

services:
  db:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:15-alpine
    container_name: kgschema-db
    environment:
      POSTGRES_USER: ${DB_USER:-kgschema}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-kgschema}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-kgschema}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kgschema-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kgschema-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-kgschema}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-kgschema}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_ACCESS_EXPIRE_MINUTES: 30
      JWT_REFRESH_EXPIRE_DAYS: 7
      DEBUG: ${DEBUG:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8002:8000"
    volumes:
      - ./app:/app/app # For development hot-reload
    networks:
      - kgschema-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: kgschema-frontend
    environment:
      - VITE_API_URL=http://localhost:8002
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src # For development hot-reload
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    networks:
      - kgschema-network
    restart: unless-stopped

volumes:
  pgdata:


networks:
  kgschema-network:
    driver: bridge
