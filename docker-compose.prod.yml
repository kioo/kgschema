version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kgschema-db-prod
    environment:
      POSTGRES_USER: ${DB_USER:-kgschema}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-kgschema}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kgschema}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kgschema-network
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: kgschema-backend-prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-kgschema}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-kgschema}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_ACCESS_EXPIRE_MINUTES: 30
      JWT_REFRESH_EXPIRE_DAYS: 7
      DEBUG: false
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kgschema-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kgschema-frontend-prod
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - kgschema-network
    restart: always

volumes:
  pgdata:

networks:
  kgschema-network:
    driver: bridge
